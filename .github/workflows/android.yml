name: Android CI/CD Build & Test Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit and Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Update 'anayasa' Logs
        if: always()
        run: |
          # Determine success or failure status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="BAŞARILI ✅"
            DETAILS="Tüm birim testler başarıyla koşuldu, sıfır hata raporlandı. Hata ayıklama APK dosyası (app-debug.apk) başarıyla derlendi."
          else
            STATUS="BAŞARISIZ ❌"
            DETAILS="Derleme veya test adımlarında hata oluştu. Lütfen CI günlüklerini kontrol edin."
          fi

          TIMESTAMP=$(date +"%d-%m-%Y %H:%M")
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # Log to ISLEM_GUNLUGU.md
          echo "" >> anayasa/ISLEM_GUNLUGU.md
          echo "### [$TIMESTAMP] - CI/CD Otomatik Derleme ve Test ($COMMIT_HASH)" >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **İşlem:** GitHub Actions üzerinden otomatik derleme, test ve APK çıkış tetiklemesi yapıldı." >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **Amaç:** Kod tabanının kararlılığını ve anayasa standartlarına uyumunu otomatize doğrulamak." >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **Sonuç:** $DETAILS Status: $STATUS" >> anayasa/ISLEM_GUNLUGU.md

          # Log to OZELLIK_TESTLERI_VE_SONUCLARI.md (Update CI check block)
          echo "" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "### 🤖 Otomatik CI/CD Test Doğrulaması ($TIMESTAMP)" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Commit Hash:** $COMMIT_HASH" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Test Sonucu:** $STATUS" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Açıklama:** $DETAILS" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md

      - name: Commit and Push 'anayasa' updates
        if: github.event_name == 'push' && always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add anayasa/ISLEM_GUNLUGU.md anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          git commit -m "chore: anayasa güncelleme - CI/CD Entegrasyon Raporu (${{ job.status }})" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push failed, skipping"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LanuVault-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
