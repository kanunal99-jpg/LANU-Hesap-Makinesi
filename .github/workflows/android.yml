name: Android CI/CD Build & Test Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# All tests/builds run with read-only repo access; only the dedicated
# publish job can create a release and it never runs untrusted PR source code.
permissions:
  contents: read

concurrency:
  group: lanu-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node for relay verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Verify relay protocol and Postgres security
        run: npm ci --prefix server && npm test --prefix server

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper when repository wrapper is missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit and Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Unit test Room schema verification guard
        run: python3 -m unittest discover -s scripts -p 'test_verify_room_schema.py'

      - name: Verify current Room v4 schema export
        run: python3 scripts/verify_room_schema.py app/schemas/com.example.core.database.AppDatabase/4.json

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      # Never expose long-lived signing credentials to pull_request builds.
      # The complete keyset must exist as protected repository/environment secrets.
      - name: Restore stable signing key (trusted pushes only)
        if: github.event_name == 'push'
        id: signing
        env:
          LANU_SIGNING_KEYSTORE_BASE64: ${{ secrets.LANU_SIGNING_KEYSTORE_BASE64 }}
          LANU_SIGNING_STORE_PASSWORD: ${{ secrets.LANU_SIGNING_STORE_PASSWORD }}
          LANU_SIGNING_KEY_PASSWORD: ${{ secrets.LANU_SIGNING_KEY_PASSWORD }}
          LANU_SIGNING_KEY_ALIAS: ${{ secrets.LANU_SIGNING_KEY_ALIAS }}
          LANU_SIGNING_CERT_SHA256: ${{ secrets.LANU_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$LANU_SIGNING_KEYSTORE_BASE64" "$LANU_SIGNING_STORE_PASSWORD" "$LANU_SIGNING_KEY_PASSWORD" "$LANU_SIGNING_KEY_ALIAS" "$LANU_SIGNING_CERT_SHA256"; do
            if [ -n "$value" ]; then count=$((count+1)); fi
          done
          if [ "$count" -eq 0 ]; then
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::No protected signing key installed. This debug APK CANNOT be claimed as a safe update."
          elif [ "$count" -ne 5 ]; then
            echo "::error::Incomplete LANU signing secrets. All five must be configured together."
            exit 1
          else
            expected="$(printf '%s' "$LANU_SIGNING_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Expected signing certificate fingerprint must contain 64 hex characters."
              exit 1
            fi
            safe_keystore="$RUNNER_TEMP/lanu-stable-signing.jks"
            umask 077
            printf '%s' "$LANU_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$safe_keystore"
            if [ ! -s "$safe_keystore" ]; then
              echo "::error::Stable keystore is empty or unavailable."
              exit 1
            fi
            echo "LANU_SIGNING_KEYSTORE_PATH=$safe_keystore" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_STORE_PASSWORD=$LANU_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_PASSWORD=$LANU_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_ALIAS=$LANU_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "expected_fingerprint=$expected" >> "$GITHUB_OUTPUT"
            echo "Protected keystore restored for trusted push; no private key is uploaded as artifact."
          fi

      - name: Ensure isolated CI debug keystore for PRs and unprovisioned builds
        if: github.event_name == 'pull_request' || steps.signing.outputs.mode == 'ephemeral'
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f ./debug.keystore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify packaged Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          ACTUAL="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk |
            sed -n "s/^package:.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p")"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$LANU_VERSION_CODE"

      - name: Verify APK certificate and pinned signing identity
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          EXPECTED_FINGERPRINT: ${{ steps.signing.outputs.expected_fingerprint }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" && test -s "$apk"
          cert_report="$("$apksigner" verify --print-certs "$apk")"
          # Print only public certificate information to make build-tool format changes diagnosable.
          printf '%s\n' "$cert_report" | grep -Ei '(certificate|signer|SHA-256)' | head -n 12 || true
          actual="$(printf '%s\n' "$cert_report" |
            sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+).*/\1/p' |
            head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to verify the APK signing certificate."
            exit 1
          fi
          if [ "$SIGNING_MODE" = "stable" ]; then
            if [ "$actual" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::APK signing certificate differs from pinned fingerprint; release blocked."
              exit 1
            fi
          fi
          mkdir -p app/build/reports/verification
          {
            echo "apk=app-debug.apk"
            echo "signing_mode=${SIGNING_MODE:-ephemeral}"
            echo "certificate_sha256=$actual"
            echo "upgrade_verified_on_device=false"
          } > app/build/reports/verification/app-debug.apk.signer.txt
          echo "APK certificate verified: $actual (mode=${SIGNING_MODE:-ephemeral})"

      - name: Generate and verify portable APK SHA256
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          mkdir -p app/build/reports/verification
          # A checksum that embeds repository paths cannot be checked after
          # downloading the APK and .sha256 into the same phone/PC folder.
          (cd "$APK_DIR" && sha256sum app-debug.apk) > app/build/reports/verification/app-debug.apk.sha256
          (cd "$APK_DIR" && sha256sum -c ../../../reports/verification/app-debug.apk.sha256)

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LANU-Calculator-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/verification/app-debug.apk.sha256
            app/build/reports/verification/app-debug.apk.signer.txt
          retention-days: 14

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/schemas/com.example.core.database.AppDatabase/4.json
          retention-days: 14


  publish:
    name: Publish verified APK
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LANU-Calculator-Debug-APK
          path: ${{ runner.temp }}/lanu-verified

      - name: Verify published branch HEAD and artifact metadata
        id: publish_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Avoid releasing stale APKs when another commit supersedes this build.
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Newer commit on $GITHUB_REF_NAME. Skipping stale APK release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/lanu-verified"
          mapfile -t apk < <(find "$dir" -type f -name 'app-debug.apk')
          mapfile -t checksum < <(find "$dir" -type f -name 'app-debug.apk.sha256')
          mapfile -t signer < <(find "$dir" -type f -name 'app-debug.apk.signer.txt')
          if [ "${#apk[@]}" -ne 1 ] || [ "${#checksum[@]}" -ne 1 ] || [ "${#signer[@]}" -ne 1 ]; then
            echo "::error::Verified APK artifact is incomplete or ambiguous."
            exit 1
          fi
          (cd "$(dirname "${apk[0]}")" && sha256sum -c "${checksum[0]}")
          actual_sha="$(sha256sum "${apk[0]}" | cut -d' ' -f1)"
          declared_sha="$(cut -c1-64 "${checksum[0]}")"
          [ "$actual_sha" = "$declared_sha" ]
          grep -qx 'apk=app-debug.apk' "${signer[0]}"
          mode="$(sed -n 's/^signing_mode=//p' "${signer[0]}")"
          if [ "$mode" != "stable" ] && [ "$mode" != "ephemeral" ]; then
            echo "::error::Unknown APK signing mode."
            exit 1
          fi
          echo "apk=${apk[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum[0]}" >> "$GITHUB_OUTPUT"
          echo "signer=${signer[0]}" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release from verified artifact
        if: steps.publish_guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.publish_guard.outputs.mode }}
          APK_PATH: ${{ steps.publish_guard.outputs.apk }}
          CHECKSUM_PATH: ${{ steps.publish_guard.outputs.checksum }}
          SIGNER_PATH: ${{ steps.publish_guard.outputs.signer }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = "stable" ]; then
            TAG="v1.1.0-signed.${{ github.run_number }}"
            NOTES="Korunan anahtarla imzalanmış APK. Önceki rastgele debug imzalı kurulumların üzerine güvenli yükseltme garanti değildir; gerçek cihaz testi gerekir."
          else
            TAG="v1.0.0-debug.${{ github.run_number }}"
            NOTES="GEÇİCİ DEBUG SERTİFİKASI. Bu APK eski kurulumun üzerine veri kayıpsız güncelleme garantisi vermez. Kurulu LANU uygulamasını kaldırmayın."
          fi
          gh release create "$TAG" \
            "$APK_PATH" "$CHECKSUM_PATH" "$SIGNER_PATH" \
            --target "$GITHUB_SHA" \
            --title "LANU CALCULATOR $TAG" \
            --notes "Commit: $GITHUB_SHA. $NOTES" \
            --prerelease
