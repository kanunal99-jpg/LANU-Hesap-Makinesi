name: Android CI/CD Build & Test Automation

on:
  push:
    branches: [ "main", "master", "feat/communication-real-backend-v2" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper when repository wrapper is missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit and Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Ensure CI Debug Keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f ./debug.keystore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Generate APK SHA256
        if: success()
        run: |
          mkdir -p app/build/reports/verification
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/reports/verification/app-debug.apk.sha256

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LANU-Calculator-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/verification/app-debug.apk.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref == 'feat/communication-real-backend-v2'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-debug.${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/reports/verification/app-debug.apk.sha256 \
            --target "${{ github.sha }}" \
            --title "LANU CALCULATOR $TAG" \
            --notes "CI doğrulamalı debug APK. Commit: ${{ github.sha }}" \
            --prerelease

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Update 'anayasa' Logs
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="BAŞARILI ✅"
            DETAILS="Unit/Robolectric testleri, Debug Lint, Debug APK derlemesi ve GitHub Release adımları CI üzerinde tamamlandı."
          else
            STATUS="BAŞARISIZ ❌"
            DETAILS="CI test, lint, derleme veya release adımlarından en az biri başarısız oldu. Gerçek CI günlükleri kanıt kabul edilir."
          fi

          TIMESTAMP=$(date +"%d-%m-%Y %H:%M")
          COMMIT_HASH=$(git rev-parse --short HEAD)

          mkdir -p anayasa
          echo "" >> anayasa/ISLEM_GUNLUGU.md
          echo "### [$TIMESTAMP] - CI/CD Otomatik Doğrulama ($COMMIT_HASH)" >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **İşlem:** GitHub Actions test + lint + APK derleme + release hattı çalıştırıldı." >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **Sonuç:** $STATUS" >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **Kanıt:** GitHub Actions run, artifact ve release kayıtları." >> anayasa/ISLEM_GUNLUGU.md
          echo "*   **Açıklama:** $DETAILS" >> anayasa/ISLEM_GUNLUGU.md

          echo "" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "### 🤖 CI/CD Gerçek Doğrulaması ($TIMESTAMP)" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Commit Hash:** $COMMIT_HASH" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Durum:** $STATUS" >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          echo "*   **Not:** Dokümantasyon, CI kanıtı olmadan 'başarılı' veya 'production ready' olarak işaretlenmemelidir." >> anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md

      - name: Commit and Push 'anayasa' updates
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add anayasa/ISLEM_GUNLUGU.md anayasa/OZELLIK_TESTLERI_VE_SONUCLARI.md
          git commit -m "chore: anayasa güncelleme - CI gerçek doğrulama (${{ job.status }})" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }} || echo "Push failed, skipping"
