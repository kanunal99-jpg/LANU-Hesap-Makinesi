name: Android CI/CD Build & Test Automation

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Trusted owner can publish the first stable APK after provisioning signing secrets
  pull_request:
    branches: [ "main", "master" ]

# All tests/builds run with read-only repo access; only the dedicated
# publish job can create a release and it never runs untrusted PR source code.
permissions:
  contents: read

concurrency:
  group: lanu-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build APK and Run Tests
    runs-on: ubuntu-latest
    env:
      LANU_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node for relay verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Verify relay protocol and Postgres security
        run: npm ci --prefix server && npm test --prefix server

      - name: Test privacy-safe WebRTC native failure explanations
        run: python3 -m unittest discover -s scripts -p 'test_rtc_failure_diagnose.py'

      - name: Verify deployed Supabase migration IDs and bounded retention schedule
        run: python3 -m unittest discover -s scripts -p 'test_verify_supabase_migrations.py'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper when repository wrapper is missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Independent regression gate: fresh bidirectional audio RTP after ICE
      # reconnect, rejecting stale async statistics and counter resets.
      - name: Verify real call packet freshness after reconnect
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.CallRtpEvidenceTrackerTest' --no-daemon --stacktrace

      # Independent anti-replay regression gate: no false BUSY during a
      # retransmitted INVITE and no re-ring after the call has ended.
      - name: Verify call invitation replay and busy handling
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.NativeCallStateTest' --no-daemon --stacktrace

      - name: Verify OEM camera fallback and AEC/NS policy
        run: ./gradlew :app:testDebugUnitTest --tests 'com.example.CallCameraFallbackTest' --tests 'com.example.CallAudioProcessingPolicyTest' --no-daemon --stacktrace

      - name: Run Unit and Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Unit test Room schema verification guard
        run: python3 -m unittest discover -s scripts -p 'test_verify_room_schema.py'

      - name: Reject destructive Room migration and protect E2EE history
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_room_migration_safety.py'
          python3 scripts/verify_room_migration_safety.py

      - name: Verify current Room v4 schema export
        run: python3 scripts/verify_room_schema.py app/schemas/com.example.core.database.AppDatabase/4.json docs/ROOM_V4_SCHEMA.sha256

      - name: Verify Android Keystore privacy and backup controls
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_android_privacy.py'
          python3 scripts/verify_android_privacy.py

      - name: Validate owner-side stable signing bootstrap syntax
        run: bash -n scripts/bootstrap_stable_signing.sh

      # Uses only generated DUMMY PKCS12 fixtures; no production signing
      # key/password is exposed to PR jobs or CI output.
      - name: Verify encrypted signing backup and release HTTP500 fallback
        run: |
          bash -n scripts/backup_stable_signing_encrypted.sh
          bash -n scripts/test_backup_stable_signing_encrypted.sh
          bash scripts/test_backup_stable_signing_encrypted.sh
          bash -n scripts/verify_offdevice_signing_recovery.sh
          bash -n scripts/test_verify_offdevice_signing_recovery.sh
          bash scripts/test_verify_offdevice_signing_recovery.sh
          bash -n scripts/publish_verified_release_retry.sh
          bash -n scripts/test_publish_verified_release_retry.sh
          bash scripts/test_publish_verified_release_retry.sh

      - name: Test APK publication and stable signing continuity
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_published_apk.py'
          python3 -m unittest discover -s scripts -p 'test_verify_stable_signer_continuity.py'

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      # Never expose long-lived signing credentials to pull_request builds.
      # The complete keyset must exist as protected repository/environment secrets.
      - name: Restore stable signing key (trusted main pushes and manual dispatches)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: signing
        env:
          LANU_SIGNING_KEYSTORE_BASE64: ${{ secrets.LANU_SIGNING_KEYSTORE_BASE64 }}
          LANU_SIGNING_STORE_PASSWORD: ${{ secrets.LANU_SIGNING_STORE_PASSWORD }}
          LANU_SIGNING_KEY_PASSWORD: ${{ secrets.LANU_SIGNING_KEY_PASSWORD }}
          LANU_SIGNING_KEY_ALIAS: ${{ secrets.LANU_SIGNING_KEY_ALIAS }}
          LANU_SIGNING_CERT_SHA256: ${{ secrets.LANU_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for value in "$LANU_SIGNING_KEYSTORE_BASE64" "$LANU_SIGNING_STORE_PASSWORD" "$LANU_SIGNING_KEY_PASSWORD" "$LANU_SIGNING_KEY_ALIAS" "$LANU_SIGNING_CERT_SHA256"; do
            if [ -n "$value" ]; then count=$((count+1)); fi
          done
          if [ "$count" -eq 0 ]; then
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::No protected signing key installed. This debug APK CANNOT be claimed as a safe update."
          elif [ "$count" -ne 5 ]; then
            echo "::error::Incomplete LANU signing secrets. All five must be configured together."
            exit 1
          else
            expected="$(printf '%s' "$LANU_SIGNING_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Expected signing certificate fingerprint must contain 64 hex characters."
              exit 1
            fi
            safe_keystore="$RUNNER_TEMP/lanu-stable-signing.jks"
            umask 077
            printf '%s' "$LANU_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$safe_keystore"
            if [ ! -s "$safe_keystore" ]; then
              echo "::error::Stable keystore is empty or unavailable."
              exit 1
            fi
            echo "LANU_SIGNING_KEYSTORE_PATH=$safe_keystore" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_STORE_PASSWORD=$LANU_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_PASSWORD=$LANU_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LANU_SIGNING_KEY_ALIAS=$LANU_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "expected_fingerprint=$expected" >> "$GITHUB_OUTPUT"
            echo "Protected keystore restored for trusted push; no private key is uploaded as artifact."
          fi

      - name: Require protected signing on explicitly requested stable releases
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$SIGNING_MODE" != "stable" ]; then
            echo "::error::Manual stable release requires all five protected LANU signing secrets."
            exit 1
          fi

      - name: Ensure isolated CI debug keystore for PRs and unprovisioned builds
        if: github.event_name == 'pull_request' || steps.signing.outputs.mode == 'ephemeral'
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f ./debug.keystore

      - name: Build minified production APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          # Preserve the established OTA asset name while publishing a release variant.
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Verify packaged Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          ACTUAL="$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk |
            sed -n "s/^package:.*versionCode='\\([0-9][0-9]*\\)'.*/\\1/p")"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$LANU_VERSION_CODE"
          test -s app/build/outputs/mapping/release/mapping.txt
          if "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q 'application-debuggable'; then
            echo "::error::Published APK must be a non-debuggable minified release."
            exit 1
          fi

      - name: Verify APK certificate and pinned signing identity
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          EXPECTED_FINGERPRINT: ${{ steps.signing.outputs.expected_fingerprint }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" && test -s "$apk"
          cert_report="$("$apksigner" verify --print-certs "$apk")"
          # Print only public certificate information to make build-tool format changes diagnosable.
          printf '%s\n' "$cert_report" | grep -Ei '(certificate|signer|SHA-256)' | head -n 12 || true
          actual="$(printf '%s\n' "$cert_report" |
            sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+).*/\1/p' |
            head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to verify the APK signing certificate."
            exit 1
          fi
          if [ "$SIGNING_MODE" = "stable" ]; then
            if [ "$actual" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::APK signing certificate differs from pinned fingerprint; release blocked."
              exit 1
            fi
          fi
          mkdir -p app/build/reports/verification
          {
            echo "apk=app-debug.apk"
            echo "signing_mode=${SIGNING_MODE:-ephemeral}"
            echo "certificate_sha256=$actual"
            echo "upgrade_verified_on_device=false"
          } > app/build/reports/verification/app-debug.apk.signer.txt
          echo "APK certificate verified: $actual (mode=${SIGNING_MODE:-ephemeral})"

      - name: Generate and verify portable APK SHA256
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          mkdir -p app/build/reports/verification
          # A checksum that embeds repository paths cannot be checked after
          # downloading the APK and .sha256 into the same phone/PC folder.
          (cd "$APK_DIR" && sha256sum app-debug.apk) > app/build/reports/verification/app-debug.apk.sha256
          (cd "$APK_DIR" && sha256sum -c ../../../reports/verification/app-debug.apk.sha256)

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LANU-Calculator-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/verification/app-debug.apk.sha256
            app/build/reports/verification/app-debug.apk.signer.txt
          retention-days: 14

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/schemas/com.example.core.database.AppDatabase/4.json
          retention-days: 14


  android-runtime-acceptance:
    name: Android Runtime Database Acceptance (API 34)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle and isolated debug signing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          chmod +x ./gradlew
          keytool -genkeypair -v \
            -keystore ./debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Permit KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise Room on an Android 14 runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            bash scripts/ci_release_runtime.sh

      - name: Upload device-runtime acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Runtime-Test-Report
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/

  publish:
    name: Publish verified APK
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build-and-test, android-runtime-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release verification policy
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LANU-Calculator-Debug-APK
          path: ${{ runner.temp }}/lanu-verified

      - name: Verify published branch HEAD and artifact metadata
        id: publish_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Avoid releasing stale APKs when another commit supersedes this build.
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Newer commit on $GITHUB_REF_NAME. Skipping stale APK release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/lanu-verified"
          mapfile -t apk < <(find "$dir" -type f -name 'app-debug.apk')
          mapfile -t checksum < <(find "$dir" -type f -name 'app-debug.apk.sha256')
          mapfile -t signer < <(find "$dir" -type f -name 'app-debug.apk.signer.txt')
          if [ "${#apk[@]}" -ne 1 ] || [ "${#checksum[@]}" -ne 1 ] || [ "${#signer[@]}" -ne 1 ]; then
            echo "::error::Verified APK artifact is incomplete or ambiguous."
            exit 1
          fi
          (cd "$(dirname "${apk[0]}")" && sha256sum -c "${checksum[0]}")
          actual_sha="$(sha256sum "${apk[0]}" | cut -d' ' -f1)"
          declared_sha="$(cut -c1-64 "${checksum[0]}")"
          [ "$actual_sha" = "$declared_sha" ]
          grep -qx 'apk=app-debug.apk' "${signer[0]}"
          mode="$(sed -n 's/^signing_mode=//p' "${signer[0]}")"
          if [ "$mode" != "stable" ] && [ "$mode" != "ephemeral" ]; then
            echo "::error::Unknown APK signing mode."
            exit 1
          fi
          echo "apk=${apk[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum[0]}" >> "$GITHUB_OUTPUT"
          echo "signer=${signer[0]}" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Block stable release when prior stable certificate changed
        if: steps.publish_guard.outputs.publish == 'true' && steps.publish_guard.outputs.mode == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SIGNER: ${{ steps.publish_guard.outputs.signer }}
        run: |
          set -euo pipefail
          # The first protected-key release establishes a baseline. Subsequent
          # stable releases must keep the exact same public signing identity.
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | test("^v1\\.1\\.0-signed\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name // ""')"
          if [ -z "$previous" ]; then
            echo "::notice::First protected-key release: no prior stable APK exists."
            echo "::notice::Device upgrade remains unverified; a matching signature alone cannot prove data preservation."
          else
            prev_dir="$RUNNER_TEMP/lanu-previous-stable-signer"
            mkdir -p "$prev_dir"
            gh release download "$previous" --pattern 'app-debug.apk.signer.txt' --dir "$prev_dir"
            python3 scripts/verify_stable_signer_continuity.py \
              "$CURRENT_SIGNER" "$prev_dir/app-debug.apk.signer.txt"
          fi

      - name: Create GitHub Release from verified artifact
        if: steps.publish_guard.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.publish_guard.outputs.mode }}
          APK_PATH: ${{ steps.publish_guard.outputs.apk }}
          CHECKSUM_PATH: ${{ steps.publish_guard.outputs.checksum }}
          SIGNER_PATH: ${{ steps.publish_guard.outputs.signer }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = "stable" ]; then
            TAG="v1.1.0-signed.${{ github.run_number }}"
            NOTES="Korunan anahtarla imzalanmış APK. Önceki rastgele debug imzalı kurulumların üzerine güvenli yükseltme garanti değildir; gerçek cihaz testi gerekir."
          else
            TAG="v1.0.0-debug.${{ github.run_number }}"
            NOTES="GEÇİCİ DEBUG SERTİFİKASI. Bu APK eski kurulumun üzerine veri kayıpsız güncelleme garantisi vermez. Kurulu LANU uygulamasını kaldırmayın."
          fi
          # Only retry already verified APK/signature assets, and refuse a
          # tag previously published from a different commit.
          bash scripts/publish_verified_release_retry.sh "$TAG" "$NOTES"

      # Verification MUST happen from anonymous public HTTPS download URLs,
      # not from the build runner's private artifact or authenticated API.
      - name: Re-download public APK and prove published bytes
        if: steps.publish_guard.outputs.publish == 'true'
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.publish_guard.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = "stable" ]; then
            TAG="v1.1.0-signed.${{ github.run_number }}"
          else
            TAG="v1.0.0-debug.${{ github.run_number }}"
          fi
          dir="$RUNNER_TEMP/lanu-public-download"
          mkdir -p "$dir"
          for file in app-debug.apk app-debug.apk.sha256 app-debug.apk.signer.txt; do
            curl --silent --show-error --fail --location --retry 4 \
              --retry-all-errors --retry-delay 2 --max-time 180 \
              --proto '=https' --proto-redir '=https' \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file" \
              --output "$dir/$file"
          done
          python3 scripts/verify_published_apk.py "$dir" "$RUNNER_TEMP/lanu-verified" "$SIGNING_MODE"
          echo "Publicly downloadable APK verified for $TAG"
